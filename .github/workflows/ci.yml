name: CI

on:
  merge_group:
    types: [checks_requested]
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fpm:
    if: >-
      github.event_name == 'merge_group' || github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && github.actor != 'github-merge-queue[bot]')
    runs-on: [self-hosted, itp-ubuntu24]
    steps:
      - uses: actions/checkout@v4
      - name: Install compiler and independent NetCDF oracle
        run: sudo apt-get update && sudo apt-get install -y gfortran netcdf-bin
      - uses: fortran-lang/setup-fpm@v7
      - name: Build and test
        run: |
          fpm build
          OMP_NUM_THREADS=8 fpm test

  cmake:
    if: >-
      github.event_name == 'merge_group' || github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && github.actor != 'github-merge-queue[bot]')
    runs-on: [self-hosted, itp-ubuntu24]
    steps:
      - uses: actions/checkout@v4
      - name: Install compiler and independent NetCDF oracle
        run: sudo apt-get update && sudo apt-get install -y gfortran netcdf-bin
      - name: Configure
        run: >
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          -DFORTARRAY_BUILD_TESTS=ON -DFORTARRAY_BUILD_BENCHMARKS=ON
      - name: Build and test
        run: |
          cmake --build build --parallel "${SCI_CPUS:-8}"
          OMP_NUM_THREADS=8 ctest --test-dir build --output-on-failure
      - name: Build and execute without Fortio
        run: |
          cmake -S . -B build-core -DCMAKE_BUILD_TYPE=Release \
            -DFORTARRAY_BUILD_IO=OFF -DFORTARRAY_BUILD_TESTS=ON \
            -DCMAKE_DISABLE_FIND_PACKAGE_fortio=TRUE
          cmake --build build-core --parallel "${SCI_CPUS:-8}"
          OMP_NUM_THREADS=8 ctest --test-dir build-core --output-on-failure
      - name: Install package
        run: cmake --install build --prefix "$RUNNER_TEMP/fortarray"
      - name: Verify installed package
        run: |
          cmake -S example/cmake-consumer -B consumer-build \
            -DCMAKE_PREFIX_PATH="$RUNNER_TEMP/fortarray"
          cmake --build consumer-build --parallel "${SCI_CPUS:-8}"

  thread-sanitizer:
    if: >-
      github.event_name == 'merge_group' || github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && github.actor != 'github-merge-queue[bot]')
    runs-on: [self-hosted, itp-ubuntu24]
    steps:
      - uses: actions/checkout@v4
      - name: Install compiler
        run: sudo apt-get update && sudo apt-get install -y gfortran
      - name: Configure ThreadSanitizer
        run: >
          cmake -S . -B build-tsan -DFORTARRAY_BUILD_TESTS=ON
          -DCMAKE_Fortran_FLAGS="-fsanitize=thread -fno-omit-frame-pointer -O1 -g"
          -DCMAKE_C_FLAGS="-fsanitize=thread -fno-omit-frame-pointer -O1 -g"
          -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=thread"
      - name: Build and test concurrent kernels
        run: |
          cmake --build build-tsan --parallel "${SCI_CPUS:-8}"
          OMP_NUM_THREADS=8 ctest --test-dir build-tsan \
            -R thread_safety --output-on-failure

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || format('{0}-{1}', github.ref, github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
