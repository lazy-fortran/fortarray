name = "fortarray"
version = "0.1.0"
license = "MIT"
author = "Fortarray contributors"
maintainer = "krystophny@github"
copyright = "2026 Fortarray contributors"

[build]
auto-executables = false
auto-examples = false
auto-tests = true
module-naming = false

[install]
library = true

[library]
source-dir = "src"

[fortran]
implicit-typing = false
implicit-external = false
source-form = "free"

[dependencies]
fortio = { git = "https://github.com/lazy-fortran/fortio.git", rev = "a1e15804afa22d4721446e7885cd58f74f38a59d" }
