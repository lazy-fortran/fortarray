name = "fortarray"
version = "0.1.0"
license = "MIT"
author = "Fortarray contributors"
maintainer = "krystophny@github"
copyright = "2026 Fortarray contributors"

[build]
auto-executables = false
auto-examples = false
auto-tests = true
module-naming = false

[install]
library = true

[library]
source-dir = "src"

[fortran]
implicit-typing = false
implicit-external = false
source-form = "free"

[dependencies]
fortio = { git = "https://github.com/lazy-fortran/fortio.git", rev = "cab69f3297fcda0ffa6c1acaa989da575865e64e" }

